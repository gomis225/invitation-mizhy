<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mizhy souffle sa première bougie</title>
<meta name="theme-color" content="#b57edc">
<meta property="og:title" content="Mizhy souffle sa première bougie !">
<meta property="og:description" content="Samedi 21 novembre 2026 · Bingerville cité CEPHAL">
<meta property="og:image" content="photo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--v:#b57edc;--vf:#6d3a9c;--vc:#efe2fa;--r:#f9d4e8;--rf:#e0489a;--b:#fffafd;--or:#c9a24a;--txt:#4a2a66}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Quicksand',system-ui,sans-serif;color:var(--txt);background:var(--b);line-height:1.65;overflow-x:hidden;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
h1,h2,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
section{padding:72px 24px;max-width:560px;margin:0 auto;text-align:center}
h2{font-size:2.3rem;color:var(--vf);margin-bottom:22px;line-height:1.15}
.eyebrow{letter-spacing:.3em;text-transform:uppercase;font-size:.72rem;color:var(--rf);margin-bottom:10px;font-weight:600}
.btn{display:inline-block;border:0;cursor:pointer;font:600 1rem 'Quicksand',sans-serif;color:#fff;background:linear-gradient(135deg,var(--v),var(--vf));padding:15px 30px;border-radius:50px;text-decoration:none;box-shadow:0 8px 22px rgba(109,58,156,.28);transition:transform .5s,box-shadow .5s}
.btn:active{transform:scale(.97)}
.btn.alt{background:#fff;color:var(--vf);border:1.5px solid var(--v);box-shadow:none}

/* ENVELOPPE */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;background:radial-gradient(circle at 50% 30%,#fff 0,var(--vc) 60%,var(--r) 100%);transition:opacity 1.6s ease,visibility 1.6s}
#intro.gone{opacity:0;visibility:hidden}
.env{position:relative;width:min(82vw,340px);aspect-ratio:1.4;perspective:900px}
.env .back,.env .front{position:absolute;inset:0;border-radius:8px}
.env .back{background:#9a62c7;box-shadow:0 18px 40px rgba(109,58,156,.35)}
.card{position:absolute;left:7%;right:7%;top:8%;height:86%;background:#fff;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;transition:transform 1.6s cubic-bezier(.4,0,.2,1) .9s;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:2}
.card small{letter-spacing:.25em;font-size:.6rem;color:var(--rf);text-transform:uppercase}
.card b{font:600 2rem 'Cormorant Garamond',serif;color:var(--vf)}
.env .front{z-index:3;background:linear-gradient(135deg,#b57edc,#a36bd0);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.env .front::after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,transparent 49.5%,rgba(255,255,255,.18) 50%);clip-path:polygon(0 100%,50% 45%,100% 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(180deg,#c79be6,#b57edc);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s ease,z-index 0s .5s;z-index:4;backface-visibility:hidden}
.seal{position:absolute;left:50%;top:58%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;z-index:5;display:grid;place-items:center;font-size:1.7rem;background:radial-gradient(circle at 35% 30%,#e86bb0,#b02f78 70%);box-shadow:0 4px 10px rgba(0,0,0,.3),inset 0 0 0 3px rgba(255,255,255,.18);transition:opacity .6s}
#intro.open .seal{opacity:0}
#intro.open .flap{transform:rotateX(180deg);z-index:1}
#intro.open .card{transform:translateY(-62%)}
#intro .btn{transition:opacity .8s}
#intro.open .btn{opacity:0;pointer-events:none}

/* ACCUEIL */
#site{opacity:0;transition:opacity 1.8s ease}
#site.show{opacity:1}
.hero{position:relative;min-height:100svh;max-width:none;padding:0;display:flex;align-items:flex-end;justify-content:center;color:#fff;background:#6d3a9c url(photo.jpg) center 25%/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(109,58,156,.05) 25%,rgba(80,30,120,.55) 62%,rgba(60,20,100,.92))}
.hero .in{position:relative;padding:0 22px calc(36px + env(safe-area-inset-bottom));width:100%;max-width:560px}
.hero h1{font-size:clamp(4rem,22vw,6.4rem);line-height:.95;text-shadow:0 4px 24px rgba(60,20,100,.5)}
.hero .full{letter-spacing:.14em;font-size:.78rem;text-transform:uppercase;margin:8px 0 14px;opacity:.95}
.hero p.w{font-size:1.02rem;margin-bottom:22px;opacity:.96}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd div{background:rgba(255,255,255,.17);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:10px 2px}
.cd b{display:block;font:600 1.9rem 'Cormorant Garamond',serif;line-height:1.1}
.cd span{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase}

/* SECTIONS */
.histoire{background:linear-gradient(180deg,var(--b),var(--vc) 130%);max-width:none}
.histoire>div,.prog>div{max-width:520px;margin:auto}
.histoire p{font-size:1.08rem;margin-bottom:16px}
.histoire em{color:var(--rf);font-style:normal;font-weight:600}
.orn{font-size:1.5rem;color:var(--v);margin:6px 0 16px}
.tl{list-style:none;text-align:left;position:relative;margin-top:10px}
.tl::before{content:"";position:absolute;left:18px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--v),var(--r))}
.tl li{position:relative;padding:6px 0 22px 56px}
.tl li::before{content:"";position:absolute;left:10px;top:10px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--v)}
.tl b{display:block;color:var(--vf);font:600 1.35rem 'Cormorant Garamond',serif}
.tl small{color:var(--rf);font-weight:600;letter-spacing:.1em}
.lieu .nom{font-size:1.15rem;font-weight:600;margin-bottom:16px}
.map{border-radius:22px;overflow:hidden;box-shadow:0 12px 30px rgba(109,58,156,.2);border:4px solid #fff;margin-bottom:22px;aspect-ratio:4/3}
.map iframe{width:100%;height:100%;border:0}
.rsvp{max-width:none;background:linear-gradient(180deg,var(--b),var(--r))}
.rsvp .limit{margin:0 0 24px;font-size:1.05rem}
.rsvp .limit b{color:var(--rf)}
footer{padding:64px 24px calc(48px + env(safe-area-inset-bottom));text-align:center;background:linear-gradient(180deg,var(--r),var(--vc))}
footer .serif{font-size:1.7rem;color:var(--vf);font-style:italic;margin-bottom:6px}
footer p{color:var(--rf);font-weight:600}

/* BARRE DE NAVIGATION */
.rail{position:fixed;right:max(8px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);height:44vh;max-height:340px;width:22px;z-index:20;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:6px 0}
.rail .track{position:absolute;top:6px;bottom:6px;left:50%;width:4px;margin-left:-2px;border-radius:4px;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(109,58,156,.25)}
.rail .fill{width:100%;height:0;border-radius:4px;background:linear-gradient(var(--v),var(--rf))}
.rail a{position:relative;width:22px;height:22px;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.rail a::before{content:"";width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--v);box-shadow:0 1px 4px rgba(60,20,100,.3);transition:transform .6s,background .6s,border-color .6s}
.rail a.on::before{background:var(--rf);border-color:#fff;transform:scale(1.35)}

/* ANIMATIONS */
.rv{opacity:0;transform:translateY(24px);transition:opacity 1.3s ease,transform 1.3s ease}
.rv.in{opacity:1;transform:none}
.wd{display:inline-block;opacity:0;transform:translateY(.5em);transition:opacity 1.1s ease,transform 1.1s ease}
.in .wd,.wd.in{opacity:1;transform:none}
.flt{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.flt i{position:absolute;bottom:-30px;font-style:normal;opacity:0;animation:up linear infinite}
@keyframes up{0%{opacity:0;transform:translateY(0)}15%{opacity:.7}100%{opacity:0;transform:translateY(-105vh) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{transition-duration:.01ms!important;animation:none!important;scroll-behavior:auto!important}
 .rv,.wd{opacity:1;transform:none}.flt{display:none}
}
</style>
</head>
<body class="lock">

<div id="intro">
  <div class="env" aria-hidden="true">
    <div class="back"></div>
    <div class="card"><small>Invitation</small><b>Mizhy</b><small>1 an 💜</small></div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal">🦋</div>
  </div>
  <button class="btn" id="openBtn">Ouvrir notre invitation</button>
</div>

<div id="site">
  <div class="flt" id="flt" aria-hidden="true"></div>
  <nav class="rail" id="rail" aria-label="Navigation dans la page">
    <div class="track"><div class="fill" id="fill"></div></div>
    <a href="#accueil" aria-label="Accueil"></a><a href="#histoire" aria-label="Notre histoire"></a><a href="#programme" aria-label="Le programme"></a><a href="#lieu" aria-label="Le lieu"></a><a href="#presence" aria-label="Confirmer ma présence"></a>
  </nav>

  <section class="hero" id="accueil">
    <div class="in">
      <p class="eyebrow" style="color:#fff;opacity:.9" data-t="eyebrow"></p>
      <h1 class="words" data-t="prenom"></h1>
      <p class="full" data-t="nomComplet"></p>
      <p class="w rv" data-t="accueil"></p>
      <div class="cd rv" id="cd" aria-live="off">
        <div><b id="d">0</b><span>jours</span></div><div><b id="h">0</b><span>heures</span></div>
        <div><b id="m">0</b><span>min</span></div><div><b id="s">0</b><span>sec</span></div>
      </div>
    </div>
  </section>

  <section class="histoire" id="histoire" style="padding:72px 24px">
    <div>
      <p class="eyebrow rv" data-t="histoireSur"></p>
      <h2 class="words" data-t="histoireTitre"></h2>
      <div class="orn rv">♡ 🦋 ♡</div>
      <p class="rv" data-t="histoire1"></p>
      <p class="rv" data-t="histoire2"></p>
    </div>
  </section>

  <section class="prog" id="programme">
    <div>
      <p class="eyebrow rv" data-t="progSur"></p>
      <h2 class="words" data-t="progTitre"></h2>
      <ul class="tl rv" id="prog"></ul>
    </div>
  </section>

  <section class="lieu" id="lieu">
    <p class="eyebrow rv" data-t="lieuSur"></p>
    <h2 class="words" data-t="lieuTitre"></h2>
    <p class="nom rv" data-t="lieu"></p>
    <div class="map rv"><iframe id="map" loading="lazy" title="Carte du lieu" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
    <a class="btn rv" id="route" target="_blank" rel="noopener">Ouvrir l’itinéraire</a>
  </section>

  <section class="rsvp" id="presence" style="padding:72px 24px">
    <p class="eyebrow rv" data-t="rsvpSur"></p>
    <h2 class="words" data-t="rsvpTitre"></h2>
    <p class="limit rv">Merci de répondre avant le <b id="lim"></b></p>
    <a class="btn rv" id="rsvp" target="_blank" rel="noopener">Confirmer ma présence</a>
  </section>

  <footer>
    <p class="serif rv" data-t="merci"></p>
    <p class="rv" data-t="signature"></p>
  </footer>
</div>

<script>
/* ============ TEXTES À MODIFIER ============ */
const T = {
  eyebrow: "Une première bougie",
  prenom: "Mizhy",
  nomComplet: "BOHOU Aya Miendai Mizhy",
  accueil: "Mizhy souffle sa première bougie ! Venez célébrer ce moment magique avec nous.",
  histoireSur: "Notre histoire",
  histoireTitre: "Une année de bonheur",
  histoire1: "Une année remplie de sourires, de découvertes et de grands bonheurs… Notre petite Mizhy fête déjà son tout 1er anniversaire !",
  histoire2: "Venez célébrer ce moment magique avec nous autour d’un goûter gourmand et festif !",
  progSur: "Le programme",
  progTitre: "Le jour J",
  lieuSur: "Le lieu",
  lieuTitre: "Où nous retrouver",
  lieu: "Bingerville cité CEPHAL",
  rsvpSur: "Votre réponse",
  rsvpTitre: "Confirmer ma présence",
  merci: "Merci de faire partie de mon histoire",
  signature: "Mimi la mignonne 💜"
};
const PROGRAMME = [
  ["Samedi 21 novembre · 15h00", "Accueil des invités", "Installez-vous, la fête commence !"],
  ["Après l’accueil", "Goûter gourmand et festif", "Gâteau, douceurs et bonne humeur."],
  ["Le moment magique", "La première bougie", "Mizhy souffle sa bougie, photos et sourires."]
];
const DATE_FETE = "2026-11-21T15:00:00+00:00";   // Abidjan = UTC
const DATE_LIMITE = "14 novembre 2026";           // date limite de réponse
const LIEU_MAPS = "Cité CEPHAL, Bingerville, Côte d'Ivoire";
const LIEN_FORMULAIRE = "https://forms.gle/REMPLACEZ-MOI"; // lien Google Forms / WhatsApp
/* ============================================ */

const $ = s => document.querySelector(s);
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

document.querySelectorAll('[data-t]').forEach(el => el.textContent = T[el.dataset.t]);
$('#lim').textContent = DATE_LIMITE;
$('#map').src = 'https://maps.google.com/maps?q=' + encodeURIComponent(LIEU_MAPS) + '&output=embed';
$('#route').href = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(LIEU_MAPS);
$('#rsvp').href = LIEN_FORMULAIRE;
$('#prog').innerHTML = PROGRAMME.map(p => `<li><small>${p[0]}</small><b>${p[1]}</b><span>${p[2]}</span></li>`).join('');

// titres mot par mot
document.querySelectorAll('.words').forEach(h => {
  h.innerHTML = h.textContent.split(' ').map((w, i) => `<span class="wd" style="transition-delay:${i * .22}s">${w}</span>`).join(' ');
});

// apparition au défilement
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold: .18 });
function observe() { document.querySelectorAll('.rv,.words').forEach(el => io.observe(el)); }

// compte à rebours
function tick() {
  let ms = new Date(DATE_FETE) - new Date(); if (ms < 0) ms = 0;
  const v = { d: Math.floor(ms / 864e5), h: Math.floor(ms / 36e5) % 24, m: Math.floor(ms / 6e4) % 60, s: Math.floor(ms / 1e3) % 60 };
  for (const k in v) $('#' + k).textContent = k === 'd' ? v[k] : String(v[k]).padStart(2, '0');
}
tick(); setInterval(tick, 1000);

// papillons et cœurs flottants (doux)
if (!calm) {
  const f = $('#flt'), em = ['🦋', '💜', '🤍', '🌸'];
  for (let i = 0; i < 9; i++) {
    const e = document.createElement('i');
    e.textContent = em[i % 4];
    e.style.cssText = `left:${Math.random() * 95}%;font-size:${14 + Math.random() * 10}px;animation-duration:${16 + Math.random() * 12}s;animation-delay:${Math.random() * 14}s`;
    f.appendChild(e);
  }
}

// barre de navigation : progression + point actif
const fill = $('#fill'), dots = [...document.querySelectorAll('#rail a')];
const secs = dots.map(a => document.querySelector(a.getAttribute('href')));
function rail() {
  const max = document.documentElement.scrollHeight - innerHeight;
  fill.style.height = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + '%';
  let cur = 0;
  secs.forEach((el, i) => { if (el.getBoundingClientRect().top < innerHeight * .5) cur = i; });
  dots.forEach((d, i) => d.classList.toggle('on', i === cur));
}
addEventListener('scroll', rail, { passive: true }); addEventListener('resize', rail); rail();

// ouverture de l'enveloppe
$('#openBtn').addEventListener('click', () => {
  const intro = $('#intro'); intro.classList.add('open');
  const wait = calm ? 300 : 3000;
  setTimeout(() => {
    intro.classList.add('gone');
    document.body.classList.remove('lock');
    $('#site').classList.add('show');
    window.scrollTo(0, 0);
    setTimeout(observe, 400);
  }, wait);
});
</script>
</body>
</html>
